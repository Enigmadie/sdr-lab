[workspace]
members = ["crates/server", "crates/dsp", "crates/dsp-wasm", "crates/protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "process", "io-util", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
rustfft = "6.4"
wasm-bindgen = "=0.2.100"
